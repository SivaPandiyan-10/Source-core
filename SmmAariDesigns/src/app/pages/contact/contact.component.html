<app-page-template pageKey="contact" />
<app-section title="Send a Message" subtitle="We will respond within one business day.">
  <div class="contact-grid">
    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submit()">
      <label>
        Name
        <input type="text" formControlName="name" />
      </label>
      <small *ngIf="contactForm.controls.name.touched && contactForm.controls.name.invalid">Name is required.</small>

      <label>
        Phone
        <input type="tel" formControlName="phone" />
      </label>
      <small *ngIf="contactForm.controls.phone.touched && contactForm.controls.phone.invalid">Enter a valid phone number.</small>

      <label>
        Email
        <input type="email" formControlName="email" />
      </label>
      <small *ngIf="contactForm.controls.email.touched && contactForm.controls.email.invalid">Enter a valid email.</small>

      <label>
        Message
        <textarea rows="5" formControlName="message"></textarea>
      </label>
      <small *ngIf="contactForm.controls.message.touched && contactForm.controls.message.invalid">Message is required.</small>

      <button type="submit" class="contact-form__submit">Submit</button>
    </form>

    <aside class="contact-info">
      <h3>Contact Details</h3>
      <p>{{ (siteConfig$ | async)?.address }}</p>
      <p>{{ (siteConfig$ | async)?.phone }}</p>
      <p>{{ (siteConfig$ | async)?.email }}</p>
      <a
        class="whatsapp-link"
        [href]="(socialLinks$ | async)?.whatsapp || (siteConfig$ | async)?.whatsapp || '#'"
        target="_blank"
        rel="noreferrer"
        aria-label="Chat on WhatsApp"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <path
            d="M19.11 17.35c-.25-.13-1.46-.72-1.69-.8-.23-.09-.4-.13-.57.12-.17.25-.65.8-.8.96-.15.17-.3.19-.55.06-.25-.13-1.07-.39-2.04-1.26-.76-.68-1.27-1.52-1.42-1.77-.15-.25-.02-.39.11-.52.12-.12.25-.3.38-.45.13-.15.17-.25.25-.42.09-.17.04-.32-.02-.45-.06-.13-.57-1.38-.78-1.89-.21-.5-.42-.43-.57-.44h-.49c-.17 0-.45.06-.68.32-.23.25-.88.86-.88 2.1 0 1.23.9 2.42 1.02 2.59.13.17 1.77 2.7 4.3 3.79 2.53 1.09 2.53.73 2.99.68.46-.04 1.46-.6 1.67-1.19.21-.59.21-1.09.15-1.19-.06-.11-.23-.17-.49-.3Z"
          ></path>
          <path
            d="M16.01 3.2c-7.06 0-12.78 5.72-12.78 12.78 0 2.25.59 4.45 1.7 6.39L3 29l6.81-1.78c1.87 1.02 3.98 1.56 6.2 1.56h.01c7.06 0 12.78-5.72 12.78-12.78 0-3.42-1.33-6.63-3.75-9.05A12.69 12.69 0 0 0 16.01 3.2Zm0 23.43h-.01c-2 0-3.95-.54-5.66-1.57l-.4-.24-4.04 1.06 1.08-3.94-.26-.41a10.57 10.57 0 0 1-1.63-5.56c0-5.84 4.75-10.59 10.59-10.59 2.83 0 5.49 1.1 7.49 3.1 2 2 3.1 4.66 3.1 7.49 0 5.84-4.75 10.59-10.59 10.59Z"
          ></path>
        </svg>
        <span>Chat on WhatsApp</span>
      </a>
    </aside>
  </div>
</app-section>
